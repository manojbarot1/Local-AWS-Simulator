<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Local AWS Simulator</title><style>
body{margin:0;background:#eaeded;color:#1b2733;font-family:Arial,"Helvetica Neue",sans-serif}.topline{height:4px;background:#ff9900}.login-bg{min-height:calc(100vh - 4px);display:grid;place-items:center}.login-card{width:410px;background:#fff;border:1px solid #c7cdd1;border-radius:5px;box-shadow:0 4px 18px rgba(0,0,0,.16);padding:30px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}.mark{width:38px;height:38px;border-radius:5px;background:#111820;color:#ff9900;display:grid;place-items:center;font-weight:900}.sub{color:#5f6b7a;font-size:13px;margin:8px 0 24px}.label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}.input{width:100%;height:42px;border:1px solid #879196;border-radius:4px;padding:8px 10px;box-sizing:border-box;margin-bottom:16px}.btn{width:100%;height:42px;background:#ff9900;border:1px solid #c77a00;border-radius:4px;font-weight:700;cursor:pointer}.hint{font-size:12px;color:#5f6b7a;margin-top:18px;padding-top:16px;border-top:1px solid #eaeded}.error{background:#fff0f0;border:1px solid #e0b0b0;color:#9d0000;padding:10px;border-radius:4px;margin-bottom:16px;font-size:12px}
</style></head><body><div class="topline"></div><div class="login-bg"><div class="login-card"><div class="brand"><div class="mark">L</div>Local AWS Simulator</div><div class="sub">AWS architecture training environment</div>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label class="label">Username</label><input class="input" name="username" value="demo" required><label class="label">Password</label><input class="input" type="password" name="password" value="demo" required><button class="btn">Sign in</button></form><div class="hint"><b>Training credentials</b><br>Username: demo<br>Password: demo<br><br>Runs entirely on your local computer.</div></div></div></body></html>
