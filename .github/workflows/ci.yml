name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  aws-cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Drive the simulator with the real AWS CLI
        run: |
          SIM_DB=$RUNNER_TEMP/sim.db SIM_TRANSITION_SECONDS=1 python app.py > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:8080/login && break; sleep 1; done
          bash tools/cli_smoke.sh
      - if: failure()
        run: cat $RUNNER_TEMP/server.log
